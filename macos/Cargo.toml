[package]
name = "arkimage"
version = "1.3.3"
edition = "2021"
description = "Fast, lightweight, multi-instance image viewer"
license = "MIT"

[dependencies]
# WebP: libwebp decodes straight into one buffer for the GPU path (all platforms), and
# the lossy fast path on Windows.
libwebp-sys = "0.14"
resvg = { version = "0.50.0", default-features = false, features = ["text", "system-fonts", "svgz", "raster-images"] }
winit = "0.30"
softbuffer = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "tga", "dds", "ico", "pnm", "hdr", "exr", "qoi", "rayon"] }
fast_image_resize = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
kamadak-exif = "0.6"
psd = "0.3"
fontdue = "0.9"
rfd = "0.15"
arboard = "3"
trash = "5"
dirs = "5"
muda = "0.17"
unrar = "0.5.8"
sevenz-rust2 = "0.25.0"
interprocess = "2.4.8"
ureq = "2"
# preserve_order: lottie::flat_layers puts "ddd" ahead of a layer's other keys
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
pollster = "0.4"
png = "0.18"
mozjpeg = "0.10"

# HEIC/HEIF. Windows: libheif linked statically from vcpkg (see .cargo/config.toml). Linux: system libheif.
# macOS uses the system ImageIO framework instead.
[target.'cfg(not(target_os = "macos"))'.dependencies]
# GPU image layer: DirectX 12 only on Windows (per-pixel see-through windows for the glass)
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl"] }
libheif-rs = "2"
# Lossy WebP fast path (macOS uses ImageIO instead).

# macOS: AppKit through the Objective-C runtime (Liquid Glass, Finder events, reveal).
[target.'cfg(target_os = "macos")'.dependencies]
# The app's own heap: returns freed image buffers to the system within milliseconds.
# macOS's allocator caches freed large blocks (measured: 350 MB kept after one photo).
mimalloc = { version = "0.1.52", default-features = false }
# GPU image layer: Metal only
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSGeometry", "NSObject", "NSEnumerator"] }

[target."cfg(windows)".dependencies]
mslnk = "0.1"
winreg = "0.55"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]

[build-dependencies]
winresource = "0.1.34"

# softbuffer with one patch: keep alpha on macOS for a layer marked "arkimage.alpha"
# (Liquid Glass behind Settings). See vendor/softbuffer/src/backends/cg.rs.
[patch.crates-io]
softbuffer = { path = "vendor/softbuffer" }
